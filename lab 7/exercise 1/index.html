<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Notes Manager</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
        }
        .container { width: 100%; max-width: 800px; }
        .form-card {
            background: var(--card);
            padding: 2rem; border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            margin-bottom: 2rem;
        }
        input, textarea {
            width: 100%; padding: 12px; margin: 10px 0;
            border-radius: 8px; border: 1px solid #334155;
            background: #0f172a; color: white; box-sizing: border-box;
        }
        button {
            background: var(--primary); color: white; border: none;
            padding: 12px 24px; border-radius: 8px; cursor: pointer;
            font-weight: 600; transition: 0.3s;
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        .note-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px; width: 100%;
        }
        .note-card {
            background: var(--card); padding: 1.5rem;
            border-radius: 12px; border-left: 5px solid var(--primary);
        }
        .actions { margin-top: 15px; display: flex; gap: 10px; }
        .btn-delete { background: #ef4444; }
        .btn-edit { background: #10b981; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align: center;">Study Notes Manager</h1>
    
    <div class="form-card">
        <h3 id="form-title">Add New Note</h3>
        <input type="hidden" id="note-id">
        <input type="text" id="title" placeholder="Note Title">
        <input type="text" id="subject" placeholder="Subject">
        <textarea id="description" rows="3" placeholder="Description"></textarea>
        <button onclick="saveNote()" id="save-btn">Save Note</button>
        <button onclick="resetForm()" style="background:#475569">Clear</button>
    </div>

    <div id="notes-list" class="note-grid"></div>
</div>

<script>
    const API_URL = "http://localhost:3000/notes";

    async function fetchNotes() {
        const res = await fetch(API_URL);
        const notes = await res.json();
        const list = document.getElementById('notes-list');
        list.innerHTML = notes.map(n => `
            <div class="note-card">
                <h4>${n.title} <small style="color:#94a3b8">(${n.subject})</small></h4>
                <p>${n.description}</p>
                <div class="actions">
                    <button class="btn-edit" onclick="editNote('${n._id}', '${n.title}', '${n.subject}', '${n.description}')">Edit</button>
                    <button class="btn-delete" onclick="deleteNote('${n._id}')">Delete</button>
                </div>
            </div>
        `).join('');
    }

    async function saveNote() {
        const id = document.getElementById('note-id').value;
        const data = {
            title: document.getElementById('title').value,
            subject: document.getElementById('subject').value,
            description: document.getElementById('description').value
        };

        const method = id ? 'PUT' : 'POST';
        const url = id ? `${API_URL}/${id}` : API_URL;

        await fetch(url, {
            method: method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
        });

        resetForm();
        fetchNotes();
    }

    async function deleteNote(id) {
        if(confirm('Delete this note?')) {
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            fetchNotes();
        }
    }

    function editNote(id, title, subject, desc) {
        document.getElementById('note-id').value = id;
        document.getElementById('title').value = title;
        document.getElementById('subject').value = subject;
        document.getElementById('description').value = desc;
        document.getElementById('form-title').innerText = "Edit Note";
        document.getElementById('save-btn').innerText = "Update Note";
    }

    function resetForm() {
        document.getElementById('note-id').value = "";
        document.getElementById('title').value = "";
        document.getElementById('subject').value = "";
        document.getElementById('description').value = "";
        document.getElementById('form-title').innerText = "Add New Note";
        document.getElementById('save-btn').innerText = "Save Note";
    }

    // Initial Load
    fetchNotes();
</script>

</body>
</html>
