<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina | Online Book Finder</title>
    <style>
        :root {
            --primary: #a78bfa;
            --bg: #0f172a;
            --sidebar: #1e293b;
            --card: #1e293b;
            --text: #f1f5f9;
            --accent: #22c55e;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
        }

        /* Sidebar Styling */
        nav {
            width: 260px;
            background: var(--sidebar);
            height: 100vh;
            padding: 30px 20px;
            position: fixed;
            border-right: 1px solid #334155;
        }

        nav h1 { color: var(--primary); font-size: 24px; margin-bottom: 40px; }

        .nav-group { margin-bottom: 30px; }
        .nav-label { font-size: 12px; text-transform: uppercase; color: #94a3b8; letter-spacing: 1px; margin-bottom: 10px; display: block; }

        .nav-item {
            padding: 12px;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.2s;
            margin-bottom: 4px;
        }

        .nav-item:hover { background: #334155; color: var(--primary); }

        /* Main Area */
        main {
            margin-left: 300px;
            padding: 40px;
            width: 100%;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        #searchInput {
            width: 400px;
            padding: 14px 20px;
            border-radius: 12px;
            border: 1px solid #334155;
            background: #1e293b;
            color: white;
            outline: none;
        }

        #searchInput:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(167, 139, 250, 0.2); }

        /* Book Grid */
        .book-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
        }

        .book-card {
            background: var(--card);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #334155;
            transition: transform 0.3s, border-color 0.3s;
        }

        .book-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .category-tag {
            font-size: 10px;
            background: #4c1d95;
            color: #ddd6fe;
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
        }

        .book-title { font-size: 18px; margin: 15px 0 5px 0; font-weight: 600; }
        .book-author { color: #94a3b8; font-size: 14px; margin-bottom: 15px; }

        .book-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #334155;
            padding-top: 15px;
        }

        .rating { color: #fbbf24; font-weight: bold; }
        .price { font-size: 18px; color: var(--accent); font-weight: 700; }

        .load-btn {
            display: block;
            margin: 50px auto;
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            padding: 12px 40px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
        }

        .load-btn:hover { background: var(--primary); color: white; }
    </style>
</head>
<body>

<nav>
    <h1>Lumina</h1>
    
    <div class="nav-group">
        <span class="nav-label">Discover</span>
        <div class="nav-item" onclick="fetchAll()">📚 All Books</div>
        <div class="nav-item" onclick="fetchTopRated()">⭐ Top Rated</div>
    </div>

    <div class="nav-group">
        <span class="nav-label">Categories</span>
        <div class="nav-item" onclick="filterCategory('Programming')">Programming</div>
        <div class="nav-item" onclick="filterCategory('Fiction')">Fiction</div>
        <div class="nav-item" onclick="filterCategory('Design')">Design</div>
    </div>

    <div class="nav-group">
        <span class="nav-label">Sort By</span>
        <div class="nav-item" onclick="sortBy('price')">💰 Price (Low-High)</div>
        <div class="nav-item" onclick="sortBy('rating')">📈 Highest Rating</div>
    </div>
</nav>

<main>
    <div class="header-section">
        <h2>Find your next read</h2>
        <input type="text" id="searchInput" placeholder="Search by book title..." onkeyup="searchBooks()">
    </div>
    
    <div class="book-grid" id="bookGrid">
        </div>

    <button id="loadBtn" class="load-btn" onclick="loadMore()">Load More Results</button>
</main>

<script>
    let currentPage = 1;
    let currentSearch = "";
    const API = "http://localhost:3001/books";

    async function loadBooks(url, append = false) {
        const res = await fetch(url);
        const data = await res.json();
        const grid = document.getElementById('bookGrid');
        
        const cards = data.map(book => `
            <div class="book-card">
                <span class="category-tag">${book.category}</span>
                <div class="book-title">${book.title}</div>
                <div class="book-author">by ${book.author}</div>
                <div class="book-footer">
                    <span class="rating">★ ${book.rating}</span>
                    <span class="price">₹${book.price}</span>
                </div>
            </div>
        `).join('');

        if (append) grid.innerHTML += cards;
        else grid.innerHTML = cards;

        // Hide Load More if no more data
        document.getElementById('loadBtn').style.display = data.length < 5 ? 'none' : 'block';
    }

    function fetchAll() { 
        currentPage = 1; 
        currentSearch = "";
        loadBooks(`${API}?page=1`); 
    }

    function searchBooks() {
        currentSearch = document.getElementById('searchInput').value;
        currentPage = 1;
        loadBooks(`${API}?title=${currentSearch}&page=1`);
    }

    function loadMore() {
        currentPage++;
        loadBooks(`${API}?title=${currentSearch}&page=${currentPage}`, true);
    }

    function filterCategory(cat) { loadBooks(`${API}/category/${cat}`); }
    function sortBy(field) { loadBooks(`${API}/sort/${field}`); }
    function fetchTopRated() { loadBooks(`${API}/top`); }

    // Initial Start
    fetchAll();
</script>

</body>
</html>
