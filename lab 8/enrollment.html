<!DOCTYPE html>
<html>
<head>
    <title>Course Enrollment System - ES6</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: white;
        }
        .container {
            width: 100%;
            max-width: 500px;
            padding: 30px;
            border: 1px solid #ddd;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 25px;
            color: black;
            text-align: center;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 500;
            color: black;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #f5f5f5;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            color: black;
            margin-bottom: 20px;
        }
        button:hover {
            background: #e8e8e8;
        }
        #result {
            padding: 20px;
            border: 1px solid #ddd;
            background: #fafafa;
            font-family: monospace;
            font-size: 14px;
            line-height: 1.5;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Course Enrollment System</h1>
        
        <div class="input-group">
            <label>Course Name:</label>
            <input type="text" id="courseName" placeholder="Enter course name">
        </div>
        
        <div class="input-group">
            <label>Instructor Name:</label>
            <input type="text" id="instructor" placeholder="Enter instructor">
        </div>
        
        <div class="input-group">
            <label>Seats Available (true/false):</label>
            <input type="text" id="seatsAvailable" placeholder="true or false">
        </div>
        
        <button onclick="enrollCourse()">Enroll in Course</button>
        <div id="result"></div>
    </div>

    <script>
        // ES6 Class - exactly from PPT syntax
        class Course {
            constructor(courseName, instructor) {
                this.courseName = courseName;
                this.instructor = instructor;
            }
            
            displayCourse() {
                return `Course: ${this.courseName}, Instructor: ${this.instructor}`;
            }
        }

        function enrollCourse() {
            // Get input values
            let courseName = document.getElementById("courseName").value || "Unknown Course";
            let instructor = document.getElementById("instructor").value || "Unknown Instructor";
            let seatsInput = document.getElementById("seatsAvailable").value.toLowerCase();
            
            // Create course instance
            let course1 = new Course(courseName, instructor);
            
            // Promise - exactly from PPT syntax
            let enrollCourse = new Promise((resolve, reject) => {
                let seatsAvailable = seatsInput === "true";
                
                if(seatsAvailable) {
                    resolve("Enrollment Successful");
                } else {
                    reject("Course Full");
                }
            });
            
            // Display course details first
            document.getElementById("result").innerHTML = course1.displayCourse();
            
            // Handle promise with then/catch - PPT arrow function syntax
            enrollCourse
                .then(msg => {
                    document.getElementById("result").innerHTML += `\n${msg}`;
                })
                .catch(err => {
                    document.getElementById("result").innerHTML += `\n${err}`;
                });
        }
    </script>
</body>
</html>
