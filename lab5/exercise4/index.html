<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockMaster India | Inventory System</title>
    <style>
        :root {
            --primary: #047857; /* Emerald Green */
            --warning: #f59e0b;
            --danger: #dc2626;
            --bg: #f8fafc;
        }

        body { font-family: 'Segoe UI', Tahoma, sans-serif; background: var(--bg); padding: 20px; }
        .container { max-width: 1000px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #e2e8f0; margin-bottom: 25px; padding-bottom: 15px; }
        .stats-card { background: #f0fdf4; padding: 15px 25px; border-radius: 8px; border-right: 5px solid var(--primary); text-align: right; }
        .stats-card h3 { margin: 0; font-size: 0.85rem; color: #166534; text-transform: uppercase; }
        .stats-card p { margin: 5px 0 0; font-size: 1.6rem; font-weight: 800; color: var(--primary); }

        .controls { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; margin-bottom: 25px; }
        .form-box, .search-box { background: #ffffff; border: 1px solid #e2e8f0; padding: 20px; border-radius: 8px; }
        .input-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        
        input { padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; width: 100%; box-sizing: border-box; font-size: 14px; }
        input:focus { outline: none; border-color: var(--primary); ring: 2px solid #dcfce7; }
        
        button { padding: 12px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-add { background: var(--primary); color: white; width: 100%; }
        .btn-update { background: var(--warning); color: white; width: 100%; display: none; }
        .btn-edit { background: #ecfdf5; color: var(--primary); font-size: 0.8rem; border: 1px solid #d1fae5; }
        .btn-del { background: #fef2f2; color: var(--danger); font-size: 0.8rem; border: 1px solid #fee2e2; }

        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; background: #f8fafc; padding: 15px; color: #475569; font-size: 0.8rem; border-bottom: 2px solid #e2e8f0; }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; font-size: 15px; }
        
        .low-stock { background: #fff1f2 !important; }
        .low-stock td { color: var(--danger); font-weight: 600; }
        .badge { background: #f1f5f9; padding: 4px 10px; border-radius: 20px; font-size: 12px; color: #475569; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h2>Inventory Dashboard</h2>
        <div class="stats-card">
            <h3>Total Stock Value</h3>
            <p id="totalValue">₹0.00</p>
        </div>
    </header>

    <div class="controls">
        <div class="form-box">
            <input type="hidden" id="editIndex">
            <div class="input-group">
                <input type="text" id="pName" placeholder="Product Name">
                <input type="text" id="pCategory" placeholder="Category (e.g. Electronics)">
            </div>
            <div class="input-group">
                <input type="number" id="pPrice" placeholder="Price (₹)">
                <input type="number" id="pStock" placeholder="Quantity">
            </div>
            <button id="addBtn" class="btn-add" onclick="addProduct()">+ Add New Product</button>
            <button id="updateBtn" class="btn-update" onclick="saveUpdate()">Update Record</button>
        </div>

        <div class="search-box">
            <label style="font-size: 0.8rem; font-weight: bold; color: #64748b;">Search Category</label>
            <input type="text" id="searchCat" placeholder="Type to filter..." onkeyup="filterProducts()" style="margin-top: 8px;">
            <p id="errorMsg" style="color: var(--danger); font-size: 0.8rem; margin-top: 10px;"></p>
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Category</th>
                <th>Price (INR)</th>
                <th>Stock</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="inventoryBody"></tbody>
    </table>
</div>

<script>
    let inventory = [];

    // Formatter for Indian Rupee
    const rupeeFormatter = new Intl.NumberFormat('en-IN', {
        style: 'currency',
        currency: 'INR',
        maximumFractionDigits: 2
    });

    // 1. READ
    async function loadInventory() {
        try {
            const response = await fetch('inventory.json');
            if (!response.ok) throw new Error("File 'inventory.json' not found.");
            inventory = await response.json();
            renderTable(inventory);
        } catch (err) {
            document.getElementById('errorMsg').innerText = err.message;
        }
    }

    // 2. RENDER & CALCULATE
    function renderTable(data) {
        const tbody = document.getElementById('inventoryBody');
        tbody.innerHTML = "";
        let totalVal = 0;

        data.forEach((item, index) => {
            const isLow = item.stock < 10; // Low stock warning below 10
            totalVal += (item.price * item.stock);

            tbody.innerHTML += `
                <tr class="${isLow ? 'low-stock' : ''}">
                    <td><strong>${item.id}</strong></td>
                    <td>${item.name}</td>
                    <td><span class="badge">${item.category}</span></td>
                    <td>${rupeeFormatter.format(item.price)}</td>
                    <td>${item.stock} ${isLow ? '⚠️' : ''}</td>
                    <td>
                        <button class="btn-edit" onclick="editProduct(${index})">Edit</button>
                        <button class="btn-del" onclick="deleteProduct(${index})">Delete</button>
                    </td>
                </tr>
            `;
        });

        document.getElementById('totalValue').innerText = rupeeFormatter.format(totalVal);
    }

    // 3. CREATE
    function addProduct() {
        const name = document.getElementById('pName').value;
        const cat = document.getElementById('pCategory').value;
        const price = parseFloat(document.getElementById('pPrice').value);
        const stock = parseInt(document.getElementById('pStock').value);

        if (validate(name, cat, price, stock)) {
            inventory.push({
                id: "IN" + Math.floor(1000 + Math.random() * 9000),
                name, category: cat, price, stock
            });
            renderTable(inventory);
            clearForm();
        }
    }

    // 4. UPDATE
    function editProduct(index) {
        const item = inventory[index];
        document.getElementById('pName').value = item.name;
        document.getElementById('pCategory').value = item.category;
        document.getElementById('pPrice').value = item.price;
        document.getElementById('pStock').value = item.stock;
        document.getElementById('editIndex').value = index;
        document.getElementById('addBtn').style.display = 'none';
        document.getElementById('updateBtn').style.display = 'block';
    }

    function saveUpdate() {
        const idx = document.getElementById('editIndex').value;
        inventory[idx].name = document.getElementById('pName').value;
        inventory[idx].category = document.getElementById('pCategory').value;
        inventory[idx].price = parseFloat(document.getElementById('pPrice').value);
        inventory[idx].stock = parseInt(document.getElementById('pStock').value);

        document.getElementById('addBtn').style.display = 'block';
        document.getElementById('updateBtn').style.display = 'none';
        renderTable(inventory);
        clearForm();
    }

    // 5. DELETE
    function deleteProduct(index) {
        if(confirm("Confirm deletion of this product?")) {
            inventory.splice(index, 1);
            renderTable(inventory);
        }
    }

    // 6. SEARCH
    function filterProducts() {
        const term = document.getElementById('searchCat').value.toLowerCase();
        const filtered = inventory.filter(item => 
            item.category.toLowerCase().includes(term) || 
            item.name.toLowerCase().includes(term)
        );
        renderTable(filtered);
    }

    function validate(n, c, p, s) {
        if (!n || !c || isNaN(p) || isNaN(s)) {
            alert("All fields are mandatory.");
            return false;
        }
        return true;
    }

    function clearForm() {
        document.querySelectorAll('input').forEach(i => i.value = "");
    }

    window.onload = loadInventory;
</script>
</body>
</html>
