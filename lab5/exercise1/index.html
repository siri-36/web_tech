<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management | XML & AJAX</title>
    <style>
        :root {
            --primary: #4f46e5;
            --bg: #f8fafc;
            --text-main: #1e293b;
            --error: #ef4444;
            --success: #22c55e;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: var(--bg); color: var(--text-main); padding: 40px 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        
        h2 { margin-top: 0; font-weight: 700; color: #0f172a; border-bottom: 2px solid #f1f5f9; padding-bottom: 15px; }

        /* Form Layout */
        .input-card { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; background: #f1f5f9; padding: 20px; border-radius: 12px; margin-bottom: 30px; }
        input { padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; outline: none; transition: border 0.2s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        
        button { cursor: pointer; padding: 12px 20px; border: none; border-radius: 8px; font-weight: 600; transition: all 0.2s; }
        .btn-save { background: var(--primary); color: white; }
        .btn-save:hover { background: #4338ca; transform: translateY(-1px); }

        /* Table Design */
        table { width: 100%; border-collapse: separate; border-spacing: 0; margin-top: 10px; }
        th { background: #f8fafc; text-align: left; padding: 15px; font-size: 13px; text-transform: uppercase; color: #64748b; border-bottom: 2px solid #e2e8f0; }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; font-size: 15px; }
        tr:hover td { background: #fbfcfe; }

        /* Status Messages */
        #status { padding: 12px; border-radius: 8px; margin-bottom: 20px; display: none; font-size: 14px; font-weight: 500; }
        .error-msg { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }
        .success-msg { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }

        .actions { display: flex; gap: 8px; }
        .btn-edit { background: #e0e7ff; color: #4338ca; padding: 6px 12px; font-size: 12px; }
        .btn-delete { background: #fee2e2; color: #dc2626; padding: 6px 12px; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Employee Management System</h2>
    
    <div id="status"></div>

    <div class="input-card">
        <input type="text" id="empId" placeholder="Employee ID">
        <input type="text" id="empName" placeholder="Full Name">
        <input type="text" id="empDept" placeholder="Department">
        <input type="number" id="empSalary" placeholder="Salary">
        <button class="btn-save" onclick="saveEmployee()">Save Record</button>
    </div>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Department</th>
                <th>Salary</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>
</div>

<script>
    let xmlDoc = null;

    // Load XML on startup
    window.onload = loadData;

    function loadData() {
        const xhr = new XMLHttpRequest();
        xhr.open("GET", "employees.xml", true);
        
        xhr.onload = function() {
            if (xhr.status === 200 && xhr.responseXML) {
                xmlDoc = xhr.responseXML;
                notify("System Loaded Successfully", "success");
            } else {
                handleLoadError("File not found or browser blocked access.");
            }
            renderTable();
        };

        xhr.onerror = function() {
            handleLoadError("CORS/Network Error. Running in temporary memory mode.");
            renderTable();
        };

        xhr.send();
    }

    function handleLoadError(msg) {
        // Create an empty XML structure if the file can't be reached
        const parser = new DOMParser();
        xmlDoc = parser.parseFromString("<company></company>", "text/xml");
        notify(msg, "error");
    }

    function renderTable() {
        const tbody = document.getElementById("tableBody");
        tbody.innerHTML = "";
        
        const employees = xmlDoc.getElementsByTagName("employee");
        
        if (employees.length === 0) {
            tbody.innerHTML = "<tr><td colspan='5' style='text-align:center; color:#94a3b8;'>No records available. Add one above!</td></tr>";
            return;
        }

        for (let i = 0; i < employees.length; i++) {
            const id = employees[i].getElementsByTagName("id")[0]?.textContent || "N/A";
            const name = employees[i].getElementsByTagName("name")[0]?.textContent || "N/A";
            const dept = employees[i].getElementsByTagName("department")[0]?.textContent || "N/A";
            const salary = employees[i].getElementsByTagName("salary")[0]?.textContent || "0";

            tbody.innerHTML += `
                <tr>
                    <td><b>#${id}</b></td>
                    <td>${name}</td>
                    <td>${dept}</td>
                    <td>$${Number(salary).toLocaleString()}</td>
                    <td class="actions">
                        <button class="btn-edit" onclick="editRecord('${id}')">Edit</button>
                        <button class="btn-delete" onclick="deleteRecord('${id}')">Delete</button>
                    </td>
                </tr>
            `;
        }
    }

    function saveEmployee() {
        const id = document.getElementById("empId").value;
        const name = document.getElementById("empName").value;
        const dept = document.getElementById("empDept").value;
        const salary = document.getElementById("empSalary").value;

        if (!id || !name || !dept || !salary) {
            notify("Please fill in all fields", "error");
            return;
        }

        const existingEmp = findById(id);

        if (existingEmp) {
            // Update
            existingEmp.getElementsByTagName("name")[0].textContent = name;
            existingEmp.getElementsByTagName("department")[0].textContent = dept;
            existingEmp.getElementsByTagName("salary")[0].textContent = salary;
            notify("Employee updated!", "success");
        } else {
            // Create
            const newEmp = xmlDoc.createElement("employee");
            newEmp.appendChild(createTag("id", id));
            newEmp.appendChild(createTag("name", name));
            newEmp.appendChild(createTag("department", dept));
            newEmp.appendChild(createTag("salary", salary));
            xmlDoc.documentElement.appendChild(newEmp);
            notify("Employee added successfully!", "success");
        }

        resetForm();
        renderTable();
    }

    function deleteRecord(id) {
        const emp = findById(id);
        if (emp && confirm("Are you sure you want to delete this employee?")) {
            emp.parentNode.removeChild(emp);
            notify("Record deleted", "success");
            renderTable();
        }
    }

    function editRecord(id) {
        const emp = findById(id);
        document.getElementById("empId").value = emp.getElementsByTagName("id")[0].textContent;
        document.getElementById("empName").value = emp.getElementsByTagName("name")[0].textContent;
        document.getElementById("empDept").value = emp.getElementsByTagName("department")[0].textContent;
        document.getElementById("empSalary").value = emp.getElementsByTagName("salary")[0].textContent;
        document.getElementById("empId").disabled = true;
    }

    // --- Helpers ---
    function findById(id) {
        const emps = xmlDoc.getElementsByTagName("employee");
        for (let e of emps) {
            if (e.getElementsByTagName("id")[0].textContent === id) return e;
        }
        return null;
    }

    function createTag(name, val) {
        const node = xmlDoc.createElement(name);
        node.textContent = val;
        return node;
    }

    function notify(msg, type) {
        const div = document.getElementById("status");
        div.textContent = msg;
        div.className = type === "error" ? "error-msg" : "success-msg";
        div.style.display = "block";
        setTimeout(() => div.style.display = "none", 4000);
    }

    function resetForm() {
        document.querySelectorAll(".input-card input").forEach(i => i.value = "");
        document.getElementById("empId").disabled = false;
    }
</script>

</body>
</html>
